# ALE WebUI 设计门禁（M4 收尾整改 · R10 后全量）
# push 即跑：design-exceptions 台账校验（R19）+ tokens:check（零漂移）+ tokens:contrast（三分类断言，SKIP=0）
#          + design:check（8091 规范站 12 项 + Kit 四入口 25 项，含 R18 交互断言）
# 浏览器：runner 预装 Chrome 优先，缺失则用 @puppeteer/browsers 下载（check.mjs 读 CHROME_PATH）
# Kit 四入口：CI 内现场构建 react(vite)/static(jinja2) 并装配 hub 根目录，8766 端口自检
# 运行结论回写 .github/ci-state.json（[skip ci] 防循环）——私有仓库无 API token 时，git log 即运行台账
name: design-gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: design-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kit/tools/package-lock.json

      - name: Locate Chrome（缺失则下载）
        run: |
          B="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$B" ]; then
            npx -y @puppeteer/browsers install chrome@stable --path "$HOME/.cache/pw-chrome" > /dev/null
            B="$(find "$HOME/.cache/pw-chrome" -type f -name chrome | head -1)"
          fi
          echo "CHROME_PATH=$B" >> "$GITHUB_ENV"
          echo "browser: $B"

      - name: Install tools deps
        working-directory: kit/tools
        run: npm ci --no-audit --no-fund

      - name: Serve spec-site (127.0.0.1:8765)
        run: |
          python3 -m http.server 8765 --directory spec-site > /dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/ && break || sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8765/ || { echo "spec-site 服务未就绪"; exit 1; }

      - name: Build kit entries（react + static 现场构建）
        run: |
          cd kit/skeleton-react
          npm ci --no-audit --no-fund
          npm run build
          cd ../../kit/skeleton-static
          # runner 系统 pip 受 PEP 668 保护，依次尝试：已有 → --break-system-packages → 普通
          python3 -c "import jinja2" 2>/dev/null \
            || python3 -m pip install --break-system-packages -q jinja2 \
            || python3 -m pip install -q jinja2
          python3 build.py

      - name: Assemble + serve kit root (127.0.0.1:8766)
        run: |
          mkdir -p deploy/kit/build
          cp -r deploy/kit/hub/. deploy/kit/build/
          cp -r kit/skeleton-react/dist deploy/kit/build/react
          cp -r kit/skeleton-alpine deploy/kit/build/alpine
          rm -rf deploy/kit/build/alpine/node_modules
          cp -r kit/skeleton-static/dist deploy/kit/build/static
          python3 -m http.server 8766 --directory deploy/kit/build > /dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8766/ && break || sleep 1
          done
          for u in / /react/ /alpine/ /static/; do
            curl -fsS -o /dev/null "http://127.0.0.1:8766$u" || { echo "kit 入口未就绪: $u"; exit 1; }
          done
          echo "KIT_URL=http://127.0.0.1:8766/" >> "$GITHUB_ENV"

      - name: design-exceptions 台账校验（R19：schema/owner/review-by/规则 ID）
        working-directory: kit/tools
        run: npm run exceptions:check

      - name: tokens:check（零漂移）
        working-directory: kit/tools
        run: npm run tokens:check

      - name: tokens:contrast（三分类断言，SKIP=0）
        working-directory: kit/tools
        run: npm run tokens:contrast

      - name: design:check（规范站 12 项 + Kit 四入口 25 项，含 R18 交互断言）
        working-directory: kit/tools
        env:
          CHECK_URL: http://127.0.0.1:8765/
        run: npm run design:check

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-check-artifacts
          path: kit/tools/design-check/artifacts/
          retention-days: 14

      - name: Report run conclusion（回写 ci-state.json；本步骤永不红，红只由门禁决定）
        if: always()
        run: |
          set +e
          CONCLUSION="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          mkdir -p .github

          # M6-RC/终审裁决:失败时自报死因(失败步骤 + 日志尾部)进 ci-state.json——私有仓无外部 token 也能读
          FAILED_STEPS="[]"; LOG_TAIL=""
          if [ "$CONCLUSION" != "success" ]; then
            JOB_ID="$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=1" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['jobs'][0]['id'])")"
            if [ -n "$JOB_ID" ]; then
              FAILED_STEPS="$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${JOB_ID}" \
                | python3 -c "import sys,json;j=json.load(sys.stdin);print(json.dumps([s['name'] for s in j.get('steps',[]) if s.get('conclusion')=='failure']))")"
              curl -sfL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs" > /tmp/job.log
              LOG_TAIL="$(grep -v npm notice /tmp/job.log | tail -c 4000)"
            fi
          fi
          # 写基础状态(python3 -c 单行版:YAML 块内 heredoc 终止符无法顶格,禁用)
          printf '%s' "$FAILED_STEPS" > /tmp/fs.json
          printf '%s' "$LOG_TAIL" > /tmp/lt.txt
          python3 -c "import json,datetime;state={'run_id':int('${{ github.run_id }}'),'conclusion':'${{ job.status }}','sha':'${{ github.sha }}','event':'${{ github.event_name }}','time':datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),'url':'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'};open('.github/ci-state.json','w').write(json.dumps(state,ensure_ascii=False,indent=2)+chr(10))"
          # 失败时叠加死因(仅当诊断抓到了内容;python 单行避免 heredoc)
          if [ -s /tmp/fs.json ] && [ "$CONCLUSION" != "success" ]; then
            python3 -c "import json;state=json.load(open('.github/ci-state.json'));state['failed_steps']=json.load(open('/tmp/fs.json'));state['log_tail']=open('/tmp/lt.txt',encoding='utf8',errors='replace').read()[-3000:];open('.github/ci-state.json','w').write(json.dumps(state,ensure_ascii=False,indent=2)+chr(10))"
          fi
          # 逐项门禁结果(design-check.json / kit-check.json 里 pass=false 的项)
          if [ "$CONCLUSION" != "success" ]; then
            python3 -c "
import json,os
state=json.load(open('.github/ci-state.json'))
failed=[]
for f in ['kit/tools/design-check/artifacts/design-check.json','kit/tools/design-check/artifacts/kit-check.json']:
    try:
        d=json.load(open(f))
        failed+= [c for c in d.get('checks',[]) if c.get('pass') is False]
    except Exception as e:
        failed.append({'file':f,'error':str(e)[:120]})
if failed: state['failed_items']=failed
open('.github/ci-state.json','w').write(json.dumps(state,ensure_ascii=False,indent=2)+chr(10))"
          fi
          git config user.name "ale-webui-ci"
          git config user.email "ci@users.noreply.github.com"
          git add .github/ci-state.json
          {
            git commit -m "ci: ${CONCLUSION} run ${{ github.run_id }} [skip ci]" &&
            git checkout -- . && git clean -fdq -- kit spec-site &&
            git fetch origin main &&
            git rebase origin/main &&
            git push origin "HEAD:refs/heads/main"
          } > /tmp/push.log 2>&1
          RC=$?
          {
            echo "## design-gate 运行结论"
            echo ""
            echo "- 结论：**${CONCLUSION}**"
            echo "- run：${RUN_URL}"
            echo "- ci-state.json 回写：$([ "$RC" -eq 0 ] && echo 成功 || echo "失败（RC=$RC，见下方日志）")"
            echo ""
            echo "<details><summary>回写日志（git 原始输出）</summary>"
            echo ""
            echo '```'
            cat /tmp/push.log
            echo '```'
            echo "</details>"
            echo ""
            echo '```json'
            cat .github/ci-state.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
