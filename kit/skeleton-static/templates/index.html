{% extends "base.html" %}
{% block content %}
<!-- Hero：品牌紫渐变 + 一次性入场（规范 8.4/23 章） -->
<section style="position:relative;overflow:hidden;padding:56px 32px 88px;color:#fff;background:linear-gradient(118deg, #4f3478 0%, #6b489d 55%, #7e5cb4 100%)">
  <div style="position:relative;z-index:2;width:min(100%,1080px);margin:0 auto;animation:enter-up .56s cubic-bezier(0.2,0,0,1) both">
    <p class="eyebrow" style="color:#e4d9f3">{{ hero.eyebrow }}</p>
    <h1 style="color:#fff;font-size:clamp(2rem,4vw,2.75rem);line-height:1.15;margin:0 0 8px">{{ hero.title }}</h1>
    <p style="max-width:560px;margin:0;color:#e9e1f4;font-size:1.05rem">{{ hero.subtitle }}</p>
    <div style="display:flex;flex-wrap:wrap;gap:.7rem;margin-top:22px">
      <a class="button primary" style="background:#fff;color:#4f3478" href="article.html">{{ hero.cta }}</a>
    </div>
  </div>
  <svg style="position:absolute;right:0;bottom:-2px;left:0;width:100%;height:90px;fill:var(--color-canvas)" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true"><path d="M0 50 C240 90 480 20 720 40 C960 60 1200 90 1440 50 L1440 90 L0 90 Z"/></svg>
</section>
<style>@keyframes enter-up { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }</style>

<div class="page-shell">
  <section>
    <header style="border-left:4px solid var(--color-action);padding-left:16px;margin-bottom:24px">
      <h2 style="margin:0">{{ sections["list"].title }}</h2>
      <p style="margin:4px 0 0;color:var(--color-text-muted);font-size:14px">{{ sections["list"].subtitle }}</p>
    </header>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px">
      {% for item in sections["list"]["items"] %}
      <a class="card card--interactive" href="{{ item.href }}">
        <h3 style="font-size:.98rem;margin:0 0 6px">{{ item.title }}</h3>
        <p style="margin:0;color:var(--color-text-muted);font-size:.8rem">{{ item.summary }}</p>
      </a>
      {% endfor %}
    </div>
  </section>
</div>
{% endblock %}
