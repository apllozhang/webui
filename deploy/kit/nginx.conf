server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # 三个骨架分别挂子路径（各自构建已用相对路径，可直接迁移）
    location /react/  { alias /usr/share/nginx/html/react/;  try_files $uri $uri/ /react/index.html; }
    location /alpine/ { alias /usr/share/nginx/html/alpine/; try_files $uri $uri/ /alpine/index.html; }
    location /static/ { alias /usr/share/nginx/html/static/; try_files $uri $uri/ /static/index.html; }

    # 资源缓存
    location ~* \.(css|js|png|svg)$ { expires 1d; add_header Cache-Control "public"; }

    location / { try_files $uri $uri/ /index.html; }

    add_header X-Content-Type-Options "nosniff" always;
}
